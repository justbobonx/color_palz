<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>colorz</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      font-size: 24px;
      margin: 36px;
      background: #1a1a1a;
      color: #eee;
    }
    body.light {
      background: #f2f2f2;
      color: #222;
    }
    .theme-bar {
      position: static;
    }
    .add {
      justify-self: start;
      align-self: end;
      width: 63px;
      height: 63px;
      font-size: 33px;
      line-height: 1;
    }
    h1 { font-size: 1.65rem; font-weight: 500; margin: 0 0 18px; }
    .bar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    button, textarea {
      font: inherit;
      color: #eee;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 9px;
    }
    body.light button, body.light textarea {
      color: #222;
      background: #fff;
      border-color: #ccc;
    }
    button { padding: 9px 18px; cursor: pointer; }
    button:hover { outline: 2px solid #666; outline-offset: 2px; }
    button:active { outline-color: #aaa; }
    body.light button:hover { outline-color: #999; }
    .hint { font-size: 18px; color: #888; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(252px, 1fr));
      gap: 18px;
      align-items: start;
    }
    .swatch {
      border-radius: 9px;
      overflow: hidden;
      border: 1px solid #333;
      background: #222;
    }
    body.light .swatch {
      border-color: #ccc;
      background: #fff;
    }
    .swatch.open { border-color: #888; }
    .swatch.drag { opacity: 0.4; }
    .swatch.over { outline: 3px solid #aaa; outline-offset: 3px; }
    .chip {
      height: 108px;
      cursor: grab;
    }
    .chip:active { cursor: grabbing; }
    .label {
      padding: 12px 15px;
      font-size: 20px;
      font-family: ui-monospace, monospace;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .x {
      border: 0;
      background: transparent;
      color: inherit;
      padding: 0 3px;
      font-size: 21px;
      line-height: 1;
      opacity: 0.55;
    }
    .x:hover { opacity: 1; outline: none; }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }
    h1 { font-size: 1.65rem; font-weight: 500; margin: 0; }
    .theme-bar {
      position: static;
      display: flex;
      gap: 12px;
    }
    .controls {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 9px;
      background: #1c1c1c;
    }
    body.light .controls { background: #e8e8e8; }
    .swatch.open .controls { display: grid; }
    .controls button {
      padding: 12px 3px;
      font-size: 16px;
      font-family: ui-monospace, monospace;
      border: 1px solid transparent;
      text-shadow: none;
    }
    .controls button:hover,
    .controls button:active {
      outline: 3px solid #eee;
      outline-offset: -3px;
      filter: none;
    }
    body.light .controls button:hover,
    body.light .controls button:active {
      outline-color: #111;
    }
    .io {
      position: relative;
      margin-bottom: 21px;
    }
    textarea {
      width: 100%;
      min-height: 132px;
      box-sizing: border-box;
      padding: 15px 96px 42px 15px;
      font-family: ui-monospace, monospace;
      font-size: 20px;
      resize: vertical;
    }
    #ioCopy {
      position: absolute;
      right: 12px;
      bottom: 12px;
      padding: 6px 12px;
      font-size: 18px;
    }
    .err { color: #d88; font-size: 20px; margin-top: 9px; min-height: 1em; }
  </style>
</head>
<body>
  <div class="top">
    <h1>colorz</h1>
    <div class="theme-bar">
      <button id="newBtn" type="button">New</button>
      <button id="themeBtn" type="button">Light</button>
    </div>
  </div>
  <div class="bar">
    <span class="hint">paste a list to load it · drag a chip to reorder · click to adjust · shift halves · ctrl is 2 / 1 / 1</span>
  </div>
  <div class="io" id="io">
    <textarea id="ioText" spellcheck="false"></textarea>
    <button id="ioCopy" type="button">Copy</button>
    <div class="err" id="ioErr"></div>
  </div>
  <div class="grid" id="grid"></div>
  <script>
    let colors = [
      "#9a7a38",
      "#3a5e5e",
      "#6a4654",
      "#4a5262",
      "#8a6238",
      "#5a4a62",
      "#7a4a42",
      "#4e6a58",
      "#6a5a38",
      "#4a5248",
      "#6b5238",
      "#7a5a38",
    ];
    let openIndex = -1;
    let dragIndex = -1;
    let stepMode = "normal";
    let sourceText = "";

    const grid = document.getElementById("grid");
    const io = document.getElementById("io");
    const ioText = document.getElementById("ioText");
    const ioErr = document.getElementById("ioErr");

    const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
    const hex2 = (n) => Math.round(clamp(n, 0, 255)).toString(16).padStart(2, "0");

    function hexToHsl(hex) {
      const n = parseInt(hex.slice(1), 16);
      let r = ((n >> 16) & 255) / 255;
      let g = ((n >> 8) & 255) / 255;
      let b = (n & 255) / 255;
      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      const l = (max + min) / 2;
      let h = 0;
      let s = 0;
      const d = max - min;
      if (d !== 0) {
        s = d / (1 - Math.abs(2 * l - 1));
        if (max === r) h = ((g - b) / d) % 6;
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
        if (h < 0) h += 360;
      }
      return { h, s: s * 100, l: l * 100 };
    }

    function hslToHex(h, s, l) {
      h = ((h % 360) + 360) % 360;
      s = clamp(s, 0, 100) / 100;
      l = clamp(l, 0, 100) / 100;
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = l - c / 2;
      let r = 0, g = 0, b = 0;
      if (h < 60) [r, g, b] = [c, x, 0];
      else if (h < 120) [r, g, b] = [x, c, 0];
      else if (h < 180) [r, g, b] = [0, c, x];
      else if (h < 240) [r, g, b] = [0, x, c];
      else if (h < 300) [r, g, b] = [x, 0, c];
      else [r, g, b] = [c, 0, x];
      return "#" + hex2((r + m) * 255) + hex2((g + m) * 255) + hex2((b + m) * 255);
    }

    function preview(hex, dh, ds, dl) {
      const hsl = hexToHsl(hex);
      return hslToHex(hsl.h + dh, hsl.s + ds, hsl.l + dl);
    }

    function nudge(index, dh, ds, dl) {
      colors[index] = preview(colors[index], dh, ds, dl);
      render();
      syncBox();
    }

    function genericText() {
      return `[ "${colors.join(`",  "`)}" ]`;
    }

    function exportText() {
      if (!sourceText) return genericText();
      let i = 0;
      return sourceText.replace(/#(?:[0-9a-fA-F]{6}|[0-9a-fA-F]{3})\b/g, () => colors[i++] || "");
    }

    function parseImport(text) {
      const found = text.match(/#(?:[0-9a-fA-F]{6}|[0-9a-fA-F]{3})\b/g);
      if (!found || !found.length) return null;
      return found.map((raw) => {
        let h = raw.toLowerCase();
        if (h.length === 4) h = "#" + h[1] + h[1] + h[2] + h[2] + h[3] + h[3];
        return h;
      });
    }

    function render() {
      grid.innerHTML = "";
      colors.forEach((hex, i) => {
        const el = document.createElement("div");
        el.className = "swatch" + (i === openIndex ? " open" : "");
        el.draggable = true;
        const scale = stepMode === "shift" ? 0.5 : 1;
        const fine = stepMode === "ctrl";
        const btns = [
          ["h+", "Hue +", fine ? 2 : 10 * scale, 0, 0],
          ["s+", "Sat +", 0, fine ? 1 : 6 * scale, 0],
          ["l+", "Lev +", 0, 0, fine ? 1 : 6 * scale],
          ["h-", "Hue −", fine ? -2 : -10 * scale, 0, 0],
          ["s-", "Sat −", 0, fine ? -1 : -6 * scale, 0],
          ["l-", "Lev −", 0, 0, fine ? -1 : -6 * scale],
        ];
        const controls = btns.map(([act, label, dh, ds, dl]) => {
          const next = preview(hex, dh, ds, dl);
          const ink = hexToHsl(next).l > 58 ? "#1a1a1a" : "#f4f4f4";
          return `<button type="button" data-act="${act}" style="background:${next};color:${ink}">${label}</button>`;
        }).join("");
        el.innerHTML = `
          <div class="chip" style="background:${hex}"></div>
          <div class="label"><span>${i + 1}  ${hex}</span><button type="button" class="x" data-act="del" title="Remove">×</button></div>
          <div class="controls">${controls}</div>`;
        el.addEventListener("click", (e) => {
          const act = e.target.closest("button")?.dataset.act;
          if (act === "del") {
            colors.splice(i, 1);
            if (openIndex === i) openIndex = -1;
            else if (openIndex > i) openIndex--;
            sourceText = "";
            render();
            syncBox();
            return;
          }
          if (act) {
            const btn = btns.find((b) => b[0] === act);
            nudge(i, btn[2], btn[3], btn[4]);
            return;
          }
          openIndex = openIndex === i ? -1 : i;
          render();
        });
        el.addEventListener("dragstart", (e) => {
          dragIndex = i;
          openIndex = -1;
          grid.querySelectorAll(".swatch.open").forEach((n) => n.classList.remove("open"));
          el.classList.add("drag");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", String(i));
        });
        el.addEventListener("dragend", () => {
          dragIndex = -1;
          el.classList.remove("drag");
          grid.querySelectorAll(".over").forEach((n) => n.classList.remove("over"));
        });
        el.addEventListener("dragover", (e) => {
          e.preventDefault();
          if (dragIndex !== i) el.classList.add("over");
        });
        el.addEventListener("dragleave", () => el.classList.remove("over"));
        el.addEventListener("drop", (e) => {
          e.preventDefault();
          el.classList.remove("over");
          const from = dragIndex;
          if (from < 0 || from === i) return;
          const [moved] = colors.splice(from, 1);
          colors.splice(i, 0, moved);
          if (openIndex === from) openIndex = i;
          else if (from < openIndex && i >= openIndex) openIndex--;
          else if (from > openIndex && i <= openIndex) openIndex++;
          dragIndex = -1;
          render();
          syncBox();
        });
        grid.appendChild(el);
      });
      const add = document.createElement("button");
      add.type = "button";
      add.className = "add";
      add.textContent = "+";
      add.title = "Add a color";
      add.addEventListener("click", () => {
        colors.push(randomColor(colors.length));
        sourceText = "";
        openIndex = colors.length - 1;
        render();
        syncBox();
      });
      grid.appendChild(add);
    }

    function randomColor(i) {
      return hslToHex((i * 47 + Math.random() * 24) % 360, 28 + Math.random() * 22, 32 + Math.random() * 18);
    }

    function freshList() {
      colors = Array.from({ length: 12 }, (_, i) => randomColor(i));
      sourceText = "";
      openIndex = -1;
      ioErr.textContent = "";
      render();
      syncBox();
    }

    function saveState() {
      localStorage.setItem("color-list-editor", JSON.stringify({
        colors,
        sourceText,
        light: document.body.classList.contains("light"),
      }));
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem("color-list-editor") || "null");
        if (!saved || !Array.isArray(saved.colors) || !saved.colors.length) return;
        colors = saved.colors;
        sourceText = saved.sourceText || "";
        if (saved.light) {
          document.body.classList.add("light");
          document.getElementById("themeBtn").textContent = "Dark";
        }
      } catch {}
    }

    function syncBox() {
      const next = exportText();
      if (ioText.value !== next) ioText.value = next;
      saveState();
    }

    ioText.addEventListener("input", () => {
      const next = parseImport(ioText.value);
      if (!next) {
        ioErr.textContent = "No hex colors found.";
        return;
      }
      sourceText = ioText.value;
      colors = next;
      openIndex = -1;
      ioErr.textContent = "";
      render();
      saveState();
    });
    ioText.addEventListener("blur", () => syncBox());
    document.getElementById("ioCopy").onclick = async () => {
      syncBox();
      try {
        await navigator.clipboard.writeText(ioText.value);
        ioErr.textContent = "Copied.";
      } catch {
        ioText.select();
        ioErr.textContent = "Copy failed. Text is selected.";
      }
    };

    document.getElementById("themeBtn").onclick = () => {
      const light = document.body.classList.toggle("light");
      document.getElementById("themeBtn").textContent = light ? "Dark" : "Light";
      saveState();
    };
    document.getElementById("newBtn").onclick = freshList;

    loadState();

    function setStepMode(next) {
      if (next === stepMode) return;
      stepMode = next;
      if (openIndex !== -1) render();
    }
    window.addEventListener("keydown", (e) => {
      if (e.key === "Control") setStepMode("ctrl");
      else if (e.key === "Shift") setStepMode("shift");
    });
    window.addEventListener("keyup", (e) => {
      if (e.key === "Control" && stepMode === "ctrl") setStepMode(e.shiftKey ? "shift" : "normal");
      else if (e.key === "Shift" && stepMode === "shift") setStepMode(e.ctrlKey ? "ctrl" : "normal");
    });
    window.addEventListener("blur", () => setStepMode("normal"));

    syncBox();
    render();
  </script>
</body>
</html>
